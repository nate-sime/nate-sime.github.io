<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D subduction zone</title>
    <link rel="icon" href="data:," />
    <style>
      /* White, like the research page the frame sits in and the published
         animation it replaces. */
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #fff; color: #333;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #hud { position: fixed; top: 10px; left: 12px; pointer-events: none; }
      #time { font-size: 22px; font-weight: 600; color: #222; font-variant-numeric: tabular-nums; }
      #about { font-size: 11px; color: #888; }
      /* Along the bottom, always visible: play/pause and a scrubber over the
         whole run, like a video's. */
      #timeline {
        position: fixed; left: 10px; right: 12px; bottom: 8px;
        display: flex; align-items: center; gap: 10px;
      }
      #timeline[hidden] { display: none; } /* until the model has loaded */
      #play {
        flex: none; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%;
        display: grid; place-items: center; cursor: pointer;
        background: hsla(220, 8%, 30%, 0.85); color: #fff;
      }
      #play:hover { background: hsla(220, 8%, 22%, 0.92); }
      #play svg { width: 16px; height: 16px; fill: currentColor; }
      #play .i-pause, #play.playing .i-play { display: none; }
      #play.playing .i-pause { display: block; }
      #scrub {
        flex: 1; min-width: 0; height: 28px; margin: 0;
        accent-color: hsl(220, 8%, 32%); cursor: pointer;
      }
      #play:focus-visible, #scrub:focus-visible { outline: 2px solid hsl(210, 80%, 55%); outline-offset: 2px; }
      /* Colour bars, bottom left above the timeline: temperature always (the
         slices use it), depth only while the slab is coloured by depth. */
      #legend {
        position: fixed; left: 12px; bottom: 48px; width: min(220px, 42vw);
        pointer-events: none; font-size: 11px; color: #555;
        display: flex; flex-direction: column; gap: 6px;
      }
      #legend .bar { height: 8px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); }
      #legend .ticks { position: relative; height: 13px; }
      #legend .ticks span { position: absolute; top: 1px; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
      #hint {
        position: fixed; right: 12px; bottom: 48px; max-width: 45vw;
        font-size: 11px; color: #888; text-align: right; pointer-events: none;
        transition: opacity 0.6s;
      }
      #pane {
        position: fixed; top: 8px; right: 8px; width: clamp(190px, 42%, 260px);
        max-height: calc(100% - 56px); overflow: auto; /* clear of the timeline */
      }
      #msg {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
        color: #555; text-align: center; pointer-events: none;
      }
      #msg[hidden] { display: none; }
      @media (max-width: 460px) { #hint { display: none; } }

      /* Tweakpane, light. */
      :root {
        --tp-base-background-color: hsla(220, 12%, 96%, 0.94);
        --tp-base-shadow-color: hsla(0, 0%, 0%, 0.12);
        --tp-button-background-color: hsla(220, 8%, 30%, 0.85);
        --tp-button-background-color-active: hsla(220, 8%, 20%, 0.95);
        --tp-button-background-color-focus: hsla(220, 8%, 25%, 0.9);
        --tp-button-background-color-hover: hsla(220, 8%, 25%, 0.9);
        --tp-button-foreground-color: hsla(0, 0%, 100%, 0.95);
        --tp-container-background-color: hsla(220, 10%, 30%, 0.08);
        --tp-container-background-color-active: hsla(220, 10%, 30%, 0.2);
        --tp-container-background-color-focus: hsla(220, 10%, 30%, 0.16);
        --tp-container-background-color-hover: hsla(220, 10%, 30%, 0.12);
        --tp-container-foreground-color: hsla(220, 10%, 25%, 1);
        --tp-groove-foreground-color: hsla(220, 10%, 30%, 0.12);
        --tp-input-background-color: hsla(220, 10%, 30%, 0.08);
        --tp-input-background-color-active: hsla(220, 10%, 30%, 0.2);
        --tp-input-background-color-focus: hsla(220, 10%, 30%, 0.16);
        --tp-input-background-color-hover: hsla(220, 10%, 30%, 0.12);
        --tp-input-foreground-color: hsla(220, 10%, 20%, 1);
        --tp-label-foreground-color: hsla(220, 10%, 25%, 0.75);
        --tp-monitor-background-color: hsla(220, 10%, 30%, 0.08);
        --tp-monitor-foreground-color: hsla(220, 10%, 25%, 0.6);
      }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="Three-dimensional subduction zone: the slab top, temperature slices and tracers over 11 million years"></canvas>
    <div id="hud"><div id="time"></div><div id="about"></div></div>
    <div id="legend">
      <div>
        <div>temperature (K)</div>
        <div id="bar-temp" class="bar"></div>
        <div id="ticks-temp" class="ticks"></div>
      </div>
      <div id="legend-depth" hidden>
        <div>slab-top depth (km)</div>
        <div id="bar-depth" class="bar"></div>
        <div id="ticks-depth" class="ticks"></div>
      </div>
    </div>
    <div id="hint"></div>
    <div id="timeline" hidden>
      <button id="play" type="button" aria-label="play" title="play">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" /></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
      </button>
      <input id="scrub" type="range" min="0" max="11" step="any" value="0" aria-label="time" />
    </div>
    <div id="pane"></div>
    <div id="msg">Loading the model…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
