<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monte Carlo for vibrating structures</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05050c; color: #cfe; overflow: hidden; }
      /* Two columns: the graphs with their caption and readout, and the pane.
         The graphs never sit under the pane, so nothing they draw is hidden —
         except on a narrow embed, where the pane floats over them and collapses. */
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 272px;
        gap: 0;
      }
      #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      #caption {
        padding: 8px 12px 4px;
        font: 12px/1.4 ui-monospace, monospace; color: rgba(207, 238, 255, 0.70);
      }
      /* Every graph of the view at once, in a grid whose shape the view sets
         (ui/figure.ts); a hairline between panels. */
      #figure {
        flex: 1 1 auto; min-height: 0; display: grid; gap: 1px; background: rgba(207, 238, 255, 0.10);
        grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
        grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr));
      }
      #figure > canvas { width: 100%; height: 100%; min-height: 0; min-width: 0; touch-action: none; background: #05050c; }
      #readout {
        margin: 0; padding: 8px 12px 10px; box-sizing: border-box;
        max-height: 38%; overflow: auto;
        font: 12px/1.45 ui-monospace, monospace; color: #cfe;
        white-space: pre-wrap; border-top: 1px solid rgba(207, 238, 255, 0.12);
      }
      /* A rich readout (src/ui/readout.ts): a status strip, then sections side by
         side, each of lead lines, stat tiles, tables, warnings and notes. Text
         stays in ink; colour is only in the dots, the bar and a marked row. */
      #readout.rich { white-space: normal; display: flex; flex-direction: column; gap: 8px; }
      .ro-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: rgba(207, 238, 255, 0.70); }
      .ro-state { color: #cfe; font-weight: 600; }
      .ro-state::before { content: "●"; margin-right: 6px; color: rgba(207, 238, 255, 0.35); }
      .ro-state[data-state="running"]::before { color: #3987e5; }
      .ro-state[data-state="done"]::before { color: #199e70; }
      .ro-state[data-state="stopped"]::before { color: #c98500; }
      .ro-bar { flex: 0 0 120px; height: 6px; border-radius: 3px; background: rgba(207, 238, 255, 0.12); overflow: hidden; }
      .ro-bar > span { display: block; height: 100%; background: #3987e5; }
      .ro-sections { display: grid; grid-template-columns: repeat(var(--sections, 1), minmax(0, 1fr)); gap: 10px 28px; }
      .ro-section { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .ro-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: rgba(207, 238, 255, 0.70); }
      .ro-lead { color: #cfe; }
      .ro-note { font-size: 11px; color: rgba(207, 238, 255, 0.55); }
      .ro-warn::before { content: "⚠ "; color: #c98500; }
      .ro-tiles {
        display: grid; grid-template-columns: repeat(var(--tile-cols, 3), minmax(0, 1fr)); gap: 1px;
        background: rgba(207, 238, 255, 0.10); border: 1px solid rgba(207, 238, 255, 0.10);
      }
      .ro-tile { background: #05050c; padding: 6px 10px 7px; min-width: 0; }
      .ro-tile[title] { cursor: help; }
      .ro-label, .ro-detail, .ro-verdict { font-size: 11px; color: rgba(207, 238, 255, 0.70); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ro-value { font-size: 16px; font-weight: 600; color: #cfe; margin: 2px 0 1px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ro-detail:empty, .ro-verdict:empty { display: none; }
      .ro-verdict::before { content: "● "; color: rgba(207, 238, 255, 0.35); }
      .ro-verdict[data-tone="good"]::before { color: #199e70; }
      .ro-verdict[data-tone="warn"]::before { color: #c98500; }
      .ro-table { overflow-x: auto; }
      .ro-caption { font-size: 11px; color: rgba(207, 238, 255, 0.70); margin-bottom: 2px; }
      .ro-table table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
      .ro-table th { font-weight: normal; font-size: 11px; color: rgba(207, 238, 255, 0.70); border-bottom: 1px solid rgba(207, 238, 255, 0.18); }
      .ro-table th, .ro-table td { text-align: right; padding: 2px 0 2px 18px; white-space: nowrap; }
      .ro-table th:first-child, .ro-table td:first-child { text-align: left; padding-left: 6px; }
      .ro-table td:last-child, .ro-table th:last-child { padding-right: 6px; }
      .ro-table tr.mark td { background: rgba(57, 135, 229, 0.18); }
      #pane { padding: 8px 8px 8px 0; overflow-y: auto; max-height: 100vh; box-sizing: border-box; }
      @media (max-width: 640px) {
        body { grid-template-columns: minmax(0, 1fr); }
        #pane { position: fixed; top: 6px; right: 6px; width: min(256px, 70vw); padding: 0; max-height: calc(100% - 12px); }
        /* One column of panels, each tall enough to read, scrolled. */
        #figure { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: 280px; overflow-y: auto; }
        #figure > canvas { grid-column: auto !important; }
        .ro-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .ro-sections { grid-template-columns: minmax(0, 1fr); }
      }
      /* ---- the introduction (src/ui/views/intro.ts) ----
         A page over the whole frame, the pane put away: a title and a lead, the
         two parts side by side (stacked when narrow), the batch of every part
         made, and the tours as the way on. */
      #intro { display: none; }
      body.intro-on #main, body.intro-on #pane { display: none; }
      body.intro-on #intro {
        display: flex; flex-direction: column; gap: 14px;
        grid-column: 1 / -1; grid-row: 1; min-height: 0; overflow-y: auto;
        padding: 18px 22px 22px; box-sizing: border-box;
        font: 12px/1.5 ui-monospace, monospace; color: #cfe;
      }
      #intro button { font: inherit; cursor: pointer; }
      .in-kicker { font-size: 11px; letter-spacing: .08em; color: rgba(207, 238, 255, .55); }
      .in-title { margin: 2px 0 6px; font-size: 22px; line-height: 1.2; font-weight: 700; color: #fff; }
      .in-lead { margin: 0; max-width: 78ch; color: rgba(207, 238, 255, .85); }
      /* The opening paragraph runs the width of the two parts below it. */
      .in-head .in-lead { max-width: none; }
      .in-stage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .in-card {
        display: flex; flex-direction: column; min-width: 0;
        border: 1px solid rgba(207, 238, 255, .12); border-radius: 6px; background: #080812;
      }
      .in-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 0; }
      .in-name { font-weight: 600; color: #fff; }
      .in-chips { color: rgba(207, 238, 255, .55); font-size: 11px; white-space: nowrap; }
      .in-chip {
        appearance: none; border: 1px solid rgba(207, 238, 255, .18); background: none; color: rgba(207, 238, 255, .7);
        width: 22px; height: 20px; margin-left: 3px; padding: 0; border-radius: 4px; font-size: 11px !important;
      }
      .in-chip:hover { color: #fff; border-color: rgba(207, 238, 255, .4); }
      .in-chip.on { background: rgba(207, 238, 255, .14); color: #fff; border-color: rgba(207, 238, 255, .4); }
      .in-view { width: 100%; height: clamp(190px, 34vh, 340px); display: block; cursor: grab; touch-action: none; }
      .in-view:active { cursor: grabbing; }
      .in-card-foot { display: flex; gap: 6px; padding: 0 10px; }
      .in-make, .in-more {
        appearance: none; border: none; border-radius: 6px; padding: 7px 12px; color: #fff;
      }
      .in-make { flex: 1; background: #d95926; font-weight: 600; }
      .in-make:hover { background: #ef6a33; }
      .in-more { background: rgba(255, 255, 255, .08); color: #cfe; }
      .in-more:hover { background: rgba(255, 255, 255, .14); }
      .in-make:disabled, .in-more:disabled { opacity: .4; cursor: default; }
      .in-stat { padding: 7px 10px 9px; min-height: 2.9em; color: rgba(207, 238, 255, .8); }
      .in-stat b { color: #fff; font-weight: 600; }
      .in-stat .up { color: #86b6ef; }
      .in-stat .down { color: #f0956b; }
      .in-key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11px; color: rgba(207, 238, 255, .7); }
      .in-swatch { display: inline-flex; align-items: center; gap: 6px; }
      .in-swatch i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
      .in-ghost::before { content: ""; width: 14px; height: 8px; border: 1px solid rgba(220, 238, 255, .7); border-radius: 1px; }
      /* A nodal line as it is drawn: across a patch of the plate's steel. */
      .in-swatch i.in-nodal { width: 20px; background: linear-gradient(transparent 4px, #fff 4px, #fff 6px, transparent 6px), rgb(150, 164, 180); }
      .in-batch { display: flex; flex-direction: column; gap: 4px; }
      .in-strip { width: 100%; height: 96px; display: block; }
      .in-cost { margin: 0; max-width: 90ch; color: rgba(207, 238, 255, .8); }
      .in-cost b { color: #fff; font-weight: 600; }
      .in-note { margin: 0; font-size: 11px; color: rgba(207, 238, 255, .5); max-width: 100ch; }
      .in-next { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid rgba(207, 238, 255, .12); }
      .in-ask { margin: 0; font-size: 16px; color: #fff; }
      .in-tours { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
      .in-tour {
        appearance: none; display: flex; gap: 10px; align-items: flex-start; text-align: left;
        padding: 9px 12px; border-radius: 6px; border: 1px solid rgba(207, 238, 255, .14);
        background: rgba(255, 255, 255, .04); color: #cfe;
      }
      .in-tour:hover { background: rgba(255, 255, 255, .09); border-color: rgba(217, 89, 38, .7); }
      .in-tour-n { color: #d95926; font-weight: 700; }
      .in-tour-words { display: flex; flex-direction: column; gap: 2px; }
      .in-tour-words b { color: #fff; }
      .in-tour-words span { color: rgba(207, 238, 255, .7); font-size: 11px; }
      .in-explore { appearance: none; align-self: flex-start; border: none; background: none; padding: 4px 0; color: rgba(207, 238, 255, .7); }
      .in-explore:hover { color: #fff; }
      @media (max-width: 640px) {
        body.intro-on #intro { padding: 14px 16px 18px; }
        .in-stage, .in-tours { grid-template-columns: minmax(0, 1fr); }
        .in-view { height: 240px; }
      }
      /* ---- guided tour (src/ui/tour.ts), after the mantle app's ----
         The overlay sits over everything; only the pane is dimmed, and in it
         four shades tile the gap around the one lit control. The figure and
         the readout are never dimmed: they are what a step asks the reader to
         watch. `.tour-open` paints, the next frame's `.tour-lit` fades in,
         and closing waits for the fade before `display: none`. */
      #tour {
        position: fixed; inset: 0; z-index: 5;
        display: none; pointer-events: none;
        opacity: 0; transition: opacity .18s ease;
      }
      #tour.tour-open { display: block; }
      #tour.tour-lit { opacity: 1; }
      .tour-shade {
        position: absolute; background: rgba(5, 5, 12, .68); pointer-events: auto;
        transition: top .24s ease, left .24s ease, width .24s ease, height .24s ease;
      }
      .tour-ring {
        position: absolute; box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, .35); border-radius: 6px; pointer-events: none;
        transition: top .24s ease, left .24s ease, width .24s ease, height .24s ease, opacity .18s ease;
      }
      #pane { transition: opacity .24s ease; }
      /* With nothing lit the whole pane goes quiet; with a control lit the
         pane stays at full opacity (opacity applies to a whole subtree) and
         the shades dim everything in it but that control. */
      html.tour-dim-chrome #pane:not(.tour-lit-host) { opacity: .3; pointer-events: none; }
      .tour-card {
        position: absolute; box-sizing: border-box;
        width: clamp(260px, 30vw, 360px); max-height: calc(100vh - 24px); overflow-y: auto;
        padding: 12px 14px;
        background: rgba(7, 7, 14, .94); border: 1px solid rgba(255, 255, 255, .12); border-radius: 6px;
        color: #cfe; font: 12px/1.5 ui-monospace, monospace;
        pointer-events: auto;
        transition: left .24s ease, top .24s ease;
      }
      .tour-count { color: rgba(207, 238, 255, .7); font-size: 11px; letter-spacing: .04em; }
      .tour-title { margin: 2px 0 8px; font: inherit; font-weight: 700; color: #fff; }
      .tour-body p { margin: 0 0 8px; }
      .tour-body p:last-child { margin-bottom: 0; }
      .tour-list { margin: 0 0 8px; padding-left: 16px; }
      .tour-list li { margin-bottom: 4px; }
      /* What to look for, set apart from why: the second series slot's orange. */
      .tour-watch { margin-top: 10px; padding: 2px 0 2px 9px; border-left: 2px solid #d95926; color: rgba(207, 238, 255, .85); }
      /* How far the step's dwell has run. It gates nothing — see tour.ts. */
      .tour-bar { margin-top: 10px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .1); overflow: hidden; }
      .tour-bar-fill { width: 0; height: 100%; background: #d95926; }
      .tour-restore { margin-top: 12px; }
      .tour-restore .tour-btn { width: 100%; }
      .tour-nav { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
      .tour-spacer { flex: 1; }
      .tour-btn {
        appearance: none; border: none; padding: 5px 10px; border-radius: 6px;
        background: rgba(255, 255, 255, .08); color: #cfe; font: inherit; cursor: pointer;
      }
      .tour-btn:hover { background: rgba(255, 255, 255, .14); color: #fff; }
      .tour-btn:disabled { opacity: .35; cursor: default; }
      .tour-btn-quiet { padding-left: 0; background: none; color: rgba(207, 238, 255, .7); }
      .tour-btn-quiet:hover { background: none; color: #fff; }
      .tour-btn-ready { background: #d95926; color: #fff; }
      .tour-btn-ready:hover { background: #ef6a33; color: #fff; }
      @media (prefers-reduced-motion: reduce) {
        #tour, .tour-shade, .tour-ring, .tour-card, #pane { transition: none; }
      }
      @media (max-width: 640px) {
        .tour-card { width: calc(100vw - 24px); max-height: 50vh; }
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div id="caption"></div>
      <div id="figure"></div>
      <pre id="readout"></pre>
    </div>
    <div id="intro"></div>
    <div id="pane"></div>
    <div id="tour"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
