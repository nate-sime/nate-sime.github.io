<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mantle convection</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05050c; overflow: hidden; }
      body { display: grid; place-items: center; }
      #view { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
      #log {
        position: fixed; top: 0; left: 0; margin: 0; padding: 10px 12px;
        color: #cfe; background: rgba(0,0,0,.45); border-bottom-right-radius: 6px;
        font: 12px/1.45 ui-monospace, monospace; white-space: pre; pointer-events: none;
      }
      #msg {
        position: fixed; inset: 0; display: none; place-items: center;
        padding: 2rem; text-align: center; color: #cdd;
        font: 15px/1.6 system-ui, sans-serif;
      }
      #msg[data-show] { display: grid; }

      /* The control pane gets an explicit container rather than Tweakpane's
         default fixed 256px, because this page is embedded in an iframe whose
         width the page decides — at ~350px the default would sit on top of the
         readout. Scrolls rather than overflowing a short frame. */
      #pane {
        position: fixed; top: 8px; right: 8px;
        width: clamp(168px, 42%, 256px);
        max-height: calc(100% - 16px); overflow-y: auto;
      }

      /* The viscosity equation and its legend (see src/ui/equation.ts). Drawn
         as plain elements inside the pane, so it borrows Tweakpane's own colour
         variables rather than guessing at a theme, and its margins are the
         pane's container padding — otherwise it would sit flush against the
         list above it while every real blade is inset. */
      #pane .eq {
        margin: 2px var(--tp-container-horizontal-padding, 4px) 4px;
        padding: 6px 8px;
        border-radius: var(--tp-blade-border-radius, 2px);
        background-color: var(--tp-container-background-color, rgba(187, 188, 196, .1));
        color: var(--tp-container-foreground-color, #bbbcc4);
        font-size: 10px; line-height: 1.5;
      }
      #pane .eq p { margin: 0; }
      /* The formula itself: monospace so the spacing around the operators
         survives, and free to wrap, since the pane can be 168px wide. */
      #pane .eq .eq-f {
        font-family: ui-monospace, monospace; font-size: 11px;
        overflow-wrap: break-word;
      }
      #pane .eq .eq-f + .eq-f { margin-top: 2px; }
      #pane .eq sup { font-size: .75em; }
      /* symbol = value ......... the slider that sets it. The pane can be 168px
         wide, where the two do not fit on one line: the control name wraps below
         the symbol rather than the pair being squeezed into a column each. */
      #pane .eq .eq-p { display: flex; flex-wrap: wrap; gap: 0 8px; margin-top: 4px; }
      #pane .eq .eq-p b {
        font-family: ui-monospace, monospace; font-weight: 400;
        white-space: nowrap;
      }
      /* Hard right, whether it shares the symbol's line or wraps below it. */
      #pane .eq .eq-p span {
        margin-left: auto;
        color: var(--tp-label-foreground-color, rgba(187, 188, 196, .7));
      }
      #pane .eq .eq-n {
        margin-top: 5px; text-wrap: pretty;
        color: var(--tp-label-foreground-color, rgba(187, 188, 196, .7));
      }

      /* The Nusselt trace (see src/ui/nuplot.ts), mirroring the readout into the
         opposite corner: bottom-left, so it is clear of the pane on the right and
         of the readout above, and over the *outer* boundary — the cold one, and
         so the dark end of the colour map. The frame is square and the annulus
         fills it, so there is no gutter to sit in; a corner is the only place a
         panel is not covering something.

         Nearly opaque, unlike the readout's .45: this carries colour-coded marks
         rather than text, and the two series were validated for ≥ 3:1 contrast
         against the surface 8% of the field showing through can produce. */
      #nu {
        position: fixed; left: 0; bottom: 0; margin: 0;
        width: clamp(150px, 40%, 300px);
        padding: 7px 10px 6px;
        box-sizing: border-box;
        background: rgba(7, 7, 14, .92);
        border-top: 1px solid rgba(255, 255, 255, .1);
        border-right: 1px solid rgba(255, 255, 255, .1);
        border-top-right-radius: 6px;
        color: #cfe;
        font: 11px/1.4 ui-monospace, monospace;
        pointer-events: none;
      }
      /* Sized to include the tick band the canvas draws inside it, so the axis
         labels are never what gets cropped. */
      #nu canvas {
        display: block; width: 100%;
        height: clamp(54px, 11vh, 84px);
      }
      #nu figcaption {
        margin-bottom: 4px;
        color: rgba(207, 238, 255, .7);
      }
      /* Two rows, one per series — the legend is the identity channel, and it
         doubles as the live readout, which is why the values sit in it rather
         than as labels on the curve ends: at steady state the two ends coincide,
         and labels there would collide exactly when the plot matters most. */
      #nu .nu-key { margin: 4px 0 0; padding: 0; list-style: none; }
      #nu .nu-key li { display: flex; align-items: center; gap: 6px; }
      /* `height` is set per series from the width that series is stroked at
         (see nuplot.ts) — the key samples the mark rather than standing in
         for it. */
      #nu .nu-key i { width: 10px; height: 2px; border-radius: 2px; flex: none; }
      #nu .nu-key b {
        margin-left: auto; font-weight: 400;
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 600px) {
        #log { font-size: 10px; padding: 6px 8px; }
        #nu { font-size: 10px; padding: 5px 8px 4px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <pre id="log"></pre>
    <figure id="nu"></figure>
    <div id="pane"></div>
    <div id="msg"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
