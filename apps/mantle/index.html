<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mantle convection</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05050c; overflow: hidden; }
      body { display: grid; place-items: center; }
      #view { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
      /* Set from the "UI scale" slider (src/ui/controls.ts) and read by the
         three chrome overlays below — the pane, HUD and corner plots — never
         by #view: the simulation canvas already has its own scroll-to-zoom,
         and scaling it too would fight that rather than complement it. */
      :root { --ui-scale: 1; }
      /* A clean read of the canvas alone, for a screenshot or a recording —
         toggled by the pane's "hide UI (H)" button and the `H` key alike
         (see main.ts). Every one of the four chrome containers below, not a
         single wrapper around them: they are siblings of #view rather than
         children of some fifth element already, and inventing one just to
         have a single node to hide would be a layout change in service of
         a CSS selector. `#msg` is deliberately not in this list — it is a
         status overlay (build progress, a WebGPU-unavailable notice), not
         decoration, and should still say so even with the chrome off. */
      html.chrome-hidden #hud,
      html.chrome-hidden #traces,
      html.chrome-hidden #scale,
      html.chrome-hidden #pane {
        display: none;
      }
      /* Top-left HUD: an always-on caption (app name/version, and what
         colour means — set from main.ts, since the version string is only
         known at build time) stacked above the debug readout (`#log`, off
         by default — see main.ts). One flex column rather than each
         claiming the same fixed corner, so turning debug on draws `#log`
         below the caption instead of over it. */
      #hud {
        position: fixed; top: 8px; left: 8px; z-index: 2;
        display: flex; flex-direction: column; gap: 6px;
        max-width: min(70vw, 420px);
        pointer-events: none;
        /* Anchored at the corner it's pinned to, so scaling grows/shrinks it
           away from that corner rather than drifting off it. */
        transform: scale(var(--ui-scale));
        transform-origin: top left;
      }
      #caption {
        padding: 6px 10px;
        color: #cfe; background: rgba(0,0,0,.45); border-radius: 6px;
        font: 12px/1.4 ui-monospace, monospace; white-space: pre-line;
      }
      #log {
        display: none;
        margin: 0; padding: 10px 12px;
        color: #cfe; background: rgba(0,0,0,.45); border-radius: 6px;
        font: 12px/1.45 ui-monospace, monospace; white-space: pre;
      }
      /* Sits in the same #hud column as the caption/log, but unlike them takes
         clicks — #hud itself is pointer-events: none so the canvas beneath it
         stays fully interactive, and this is the one child that needs to opt
         back in. */
      #report-bug {
        align-self: flex-start;
        padding: 5px 10px;
        color: #cfe; background: rgba(0,0,0,.45); border-radius: 6px;
        font: 12px/1.4 ui-monospace, monospace;
        text-decoration: none;
        pointer-events: auto;
      }
      #report-bug:hover { color: #fff; }
      /* Groups the toggle and its popover into one visual unit — its own
         container rather than letting both sit as ordinary #hud children, so
         #hud's own `gap: 6px` (meant to separate unrelated chips) lands
         outside this pair instead of prying the button away from the panel
         it opens. */
      #ack {
        display: flex; flex-direction: column;
      }
      /* Same chip treatment as #report-bug, and the same opt-back-in into
         #hud's pointer-events for the same reason — see that rule's own
         note above. A <button> rather than an <a>: this doesn't navigate,
         it toggles #ack-panel below it. Squares off its bottom corners while
         open (`.ack-open`, toggled in lockstep with the panel below — see
         acknowledgements.ts) so the two read as one continuous shape, the
         button's own label doubling as the popover's title rather than
         repeating it inside. */
      #ack-toggle {
        align-self: flex-start;
        appearance: none; border: none;
        padding: 5px 10px;
        color: #cfe; background: rgba(0,0,0,.45); border-radius: 6px;
        font: 12px/1.4 ui-monospace, monospace;
        cursor: pointer;
        pointer-events: auto;
      }
      #ack-toggle:hover { color: #fff; }
      #ack-toggle.ack-open { border-radius: 6px 6px 0 0; }
      /* Hidden until toggled, so it costs nothing in the layout when closed.
         `display` and the fade are separate concerns — see
         src/ui/acknowledgements.ts: `display` flips straight away on open (so
         the transition below has something painted to animate from) and only
         flips back on close once that transition's `transitionend` fires (so
         the panel doesn't vanish mid-fade). Same opaque surface treatment as
         `#traces figure` (they are the same kind of thing: a small reference
         panel over the canvas), rather than the `report-bug`/`ack-toggle`
         chips' translucent one — legible names matter more here than
         blending into the canvas the way a corner chip does. Flush against
         the toggle above (no border-top, square top corners) so it reads as
         that button's own drop-down rather than a second, separate chip. */
      #ack-panel {
        display: none;
        pointer-events: auto;
        min-width: 168px;
        padding: 6px 10px;
        background: rgba(7, 7, 14, .92);
        border-right: 1px solid rgba(255, 255, 255, .1);
        border-bottom: 1px solid rgba(255, 255, 255, .1);
        border-radius: 0 0 6px 6px;
        color: #cfe;
        font: 12px/1.5 ui-monospace, monospace;
        opacity: 0;
        transform-origin: top;
        transform: scaleY(.96);
        transition: opacity .12s ease, transform .12s ease;
      }
      #ack-panel.ack-open { opacity: 1; transform: scaleY(1); }
      /* Says why the names below are listed, without repeating the toggle
         button's own "Acknowledgements" label — see acknowledgements.ts. */
      #ack-panel .ack-intro {
        margin: 0 0 4px; padding-bottom: 4px;
        color: rgba(207, 238, 255, .7);
        border-bottom: 1px solid rgba(255, 255, 255, .1);
      }
      #ack-panel ul { margin: 0; padding: 0; list-style: none; }
      #ack-panel li {
        display: flex; align-items: center; gap: 6px;
        padding: 2px 0;
        transition: transform .12s ease;
      }
      #ack-panel li + li { margin-top: 2px; }
      /* Same "coloured swatch names the row" idiom as `#traces .nu-key i` /
         `.rms-key i`, and drawn from the same validated pair-plus-two palette
         (nusselt.ts, rms.ts) rather than new colours picked just for this —
         a dot per person rather than a dash per series, since what each
         swatch names here is a person, not a stroked line. */
      #ack-panel .ack-dot {
        width: 6px; height: 6px; border-radius: 50%; flex: none;
      }
      #ack-panel a { color: #cfe; text-decoration: none; }
      #ack-panel li:hover { transform: translateX(2px); }
      #ack-panel li:hover a { color: #fff; }
      /* Signals "this leaves the page" without saying so in words — held back
         until hover so the resting list stays as plain as the rest of the HUD. */
      #ack-panel .ack-arrow {
        margin-left: auto;
        opacity: 0; transform: translateX(-2px);
        color: rgba(207, 238, 255, .7);
        transition: opacity .12s ease, transform .12s ease;
      }
      #ack-panel li:hover .ack-arrow { opacity: 1; transform: translateX(0); }
      #msg {
        position: fixed; inset: 0; display: none; place-items: center;
        padding: 2rem; text-align: center; color: #cdd;
        font: 15px/1.6 system-ui, sans-serif;
      }
      #msg[data-show] { display: grid; }

      /* The one thing still on screen the instant the chrome disappears —
         see `.chrome-hidden` above and `toggleChrome` in main.ts, which
         shows this for a few seconds on the way out and hides it again on
         the way back in (the pane's own button says "hide UI (H)" by then,
         so nothing needs to repeat itself there). Bottom-centre so it never
         competes with the HUD's top-left corner or the pane's top-right one
         while both are still fading. `opacity`, not `display`, so the fade
         has something to animate. */
      #hint {
        position: fixed; left: 50%; bottom: 20px; z-index: 4;
        transform: translateX(-50%);
        padding: 6px 12px;
        color: #cfe; background: rgba(0,0,0,.6); border-radius: 6px;
        font: 12px/1.4 ui-monospace, monospace;
        pointer-events: none;
        opacity: 0;
        transition: opacity .3s ease;
      }
      #hint.show { opacity: 1; }

      /* The "UI scale" slider's own container (src/ui/controls.ts) — a
         second, title-less Tweakpane instance, deliberately *not* one of the
         three elements `--ui-scale` resizes. Nesting the control that sets a
         transform inside the very element that transform is applied to is a
         feedback loop: the slider's own drag math reads its track's
         bounding box on every pointer move, and once dragging starts
         resizing that box out from under the pointer, a small, deliberate
         movement turns into a runaway jump toward whichever end the
         resize was already leaning. Top-centre rather than a corner: every
         corner is either already `--ui-scale`'d (`#hud`, `#pane`) or, per
         `#traces`'s own note below, effectively claimed by one that can
         grow into it (`#pane` again, bottom-right) — top-centre is the one
         strip nothing else reaches on the widths this page actually ships
         at (see `#pane`'s own note on the ~350px iframe embed).
         `translateX` centres it without depending on its own rendered
         width, which Tweakpane decides once it mounts. */
      #scale {
        position: fixed; top: 8px; left: 50%; z-index: 3;
        width: clamp(160px, 36vw, 220px);
        transform: translateX(-50%);
      }

      /* The control pane gets an explicit container rather than Tweakpane's
         default fixed 256px, because this page is embedded in an iframe whose
         width the page decides — at ~350px the default would sit on top of the
         readout. Scrolls rather than overflowing a short frame. */
      #pane {
        position: fixed; top: 8px; right: 8px;
        width: clamp(168px, 42%, 256px);
        /* Divided by --ui-scale rather than a plain `calc(100% - 16px)`:
           max-height is resolved in the pane's own unscaled box, but the
           `transform: scale` below stretches the rendered result afterward.
           At scale 1 those match, but past that the scaled box would grow
           taller than the viewport with no way to reach the overflow —
           #pane is position: fixed and body is overflow: hidden, so there's
           no page scroll to fall back on, only this element's own
           overflow-y, which never sees the part that's off-screen. Shrinking
           the unscaled height by the same factor keeps the *rendered*
           height at the viewport's own (100% - 16px), whatever the scale. */
        max-height: calc((100% - 16px) / var(--ui-scale)); overflow-y: auto;
        /* Same corner-anchored scale as #hud, on the pane's own opposite
           corner — see "UI scale" in src/ui/controls.ts. */
        transform: scale(var(--ui-scale));
        transform-origin: top right;
      }

      /* The viscosity equation and its legend (see src/ui/equation.ts). Drawn
         as plain elements inside the pane, so it borrows Tweakpane's own colour
         variables rather than guessing at a theme, and its margins are the
         pane's container padding — otherwise it would sit flush against the
         list above it while every real blade is inset. */
      #pane .eq {
        margin: 2px var(--tp-container-horizontal-padding, 4px) 4px;
        padding: 6px 8px;
        border-radius: var(--tp-blade-border-radius, 2px);
        background-color: var(--tp-container-background-color, rgba(187, 188, 196, .1));
        color: var(--tp-container-foreground-color, #bbbcc4);
        font-size: 10px; line-height: 1.5;
      }
      #pane .eq p { margin: 0; }
      /* The formula itself: monospace so the spacing around the operators
         survives, and free to wrap, since the pane can be 168px wide. */
      #pane .eq .eq-f {
        font-family: ui-monospace, monospace; font-size: 11px;
        overflow-wrap: break-word;
      }
      #pane .eq .eq-f + .eq-f { margin-top: 2px; }
      #pane .eq sup { font-size: .75em; }
      /* symbol = value ......... the slider that sets it. The pane can be 168px
         wide, where the two do not fit on one line: the control name wraps below
         the symbol rather than the pair being squeezed into a column each. */
      #pane .eq .eq-p { display: flex; flex-wrap: wrap; gap: 0 8px; margin-top: 4px; }
      #pane .eq .eq-p b {
        font-family: ui-monospace, monospace; font-weight: 400;
        white-space: nowrap;
      }
      /* Hard right, whether it shares the symbol's line or wraps below it. */
      #pane .eq .eq-p span {
        margin-left: auto;
        color: var(--tp-label-foreground-color, rgba(187, 188, 196, .7));
      }
      #pane .eq .eq-n {
        margin-top: 5px; text-wrap: pretty;
        color: var(--tp-label-foreground-color, rgba(187, 188, 196, .7));
      }

      /* Colour-bar legend (src/ui/colorbar.ts): a CSS gradient reproducing the
         shader's own control points, so it sits in the pane like `.eq` above —
         same container padding, no Tweakpane blade of its own. */
      #pane .cbar {
        margin: 2px var(--tp-container-horizontal-padding, 4px) 4px;
      }
      #pane .cbar-bar {
        height: 10px;
        border-radius: var(--tp-blade-border-radius, 2px);
        border: 1px solid rgba(255, 255, 255, .15);
      }
      #pane .cbar-ticks {
        display: flex; justify-content: space-between;
        margin-top: 2px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        color: var(--tp-label-foreground-color, rgba(187, 188, 196, .7));
      }

      /* The two corner traces (src/ui/nuplot.ts, src/ui/rmsplot.ts), stacked
         into the one corner the pane leaves clear. Not one in each bottom
         corner: `#pane`'s `max-height: calc(100% - 16px)` means it fills
         essentially the whole right edge on any viewport tall enough to
         scroll it, which every viewport with this many controls is — so
         bottom-right is the pane's own territory, not a second free corner.
         Stacking instead of placing side by side is what survives a narrow
         embed too: two 150px-floor panels do not fit side by side under
         `#pane`'s own ~168px floor, but they always fit stacked.

         `#traces` is the fixed anchor and owns none of the chrome; `nu` sits
         last so it stays flush with the viewport's bottom edge exactly where
         it always was, and `rms` sits above it with a gap standing in for the
         seam a screen edge would otherwise draw for free. */
      #traces {
        position: fixed; left: 0; bottom: 0;
        display: flex; flex-direction: column; gap: 8px;
        /* Same corner-anchored scale as #hud/#pane, on this corner's own
           bottom-left pin — see "UI scale" in src/ui/controls.ts. */
        transform: scale(var(--ui-scale));
        transform-origin: bottom left;
      }

      /* Nearly opaque, unlike the readout's .45: these carry colour-coded
         marks rather than text, and every series was validated for ≥ 3:1
         contrast against the surface 8% of the field showing through can
         produce (see `nusselt.ts`, `rms.ts`). */
      #traces figure {
        margin: 0;
        width: clamp(150px, 40vw, 300px);
        padding: 7px 10px 6px;
        box-sizing: border-box;
        background: rgba(7, 7, 14, .92);
        border-top: 1px solid rgba(255, 255, 255, .1);
        border-right: 1px solid rgba(255, 255, 255, .1);
        border-top-right-radius: 6px;
        color: #cfe;
        font: 11px/1.4 ui-monospace, monospace;
        pointer-events: none;
      }
      /* Sized to include the tick band the canvas draws inside it, so the axis
         labels are never what gets cropped. That band is two rows — the same two
         instants nondimensionally and in years — which is 28px of the height
         below, not 14. */
      #traces canvas {
        display: block; width: 100%;
        height: clamp(72px, 14vh, 106px);
      }
      #traces figcaption {
        margin-bottom: 4px;
        color: rgba(207, 238, 255, .7);
      }
      /* One row per series — the legend is the identity channel, and it
         doubles as the live readout, which is why the values sit in it rather
         than as labels on the curve ends: at steady state Nu's two ends
         coincide, and labels there would collide exactly when the plot
         matters most. */
      #traces .nu-key, #traces .rms-key { margin: 4px 0 0; padding: 0; list-style: none; }
      #traces .nu-key li, #traces .rms-key li { display: flex; align-items: center; gap: 6px; }
      /* `height` is set per series from the width that series is stroked at
         (see nuplot.ts, rmsplot.ts) — the key samples the mark rather than
         standing in for it. */
      #traces .nu-key i, #traces .rms-key i {
        width: 10px; height: 2px; border-radius: 2px; flex: none;
      }
      #traces .nu-key b, #traces .rms-key b {
        margin-left: auto; font-weight: 400;
        font-variant-numeric: tabular-nums;
      }

      /* Stand-in for Tweakpane's own slider, shared by the Courant number and
         dt cap bindings (src/ui/controls.ts): dragged in log₁₀ space so each
         decade gets an equal share of the travel, while the adjacent number
         field keeps showing/accepting the real value. Sized and coloured off
         Tweakpane's own variables so it reads as one of its sliders rather
         than a foreign control dropped into the pane. */
      #pane .co-log-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: var(--tp-container-unit-size, 20px);
        margin: 0;
        background: transparent;
      }
      #pane .co-log-slider::-webkit-slider-runnable-track {
        height: 2px;
        border-radius: 1px;
        background: var(--tp-input-background-color, rgba(187, 188, 196, .2));
      }
      #pane .co-log-slider::-moz-range-track {
        height: 2px;
        border-radius: 1px;
        background: var(--tp-input-background-color, rgba(187, 188, 196, .2));
      }
      #pane .co-log-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 8px;
        height: 16px;
        margin-top: -7px;
        border: none;
        border-radius: var(--tp-blade-border-radius, 2px);
        background: var(--tp-button-background-color, #bbbcc4);
      }
      #pane .co-log-slider::-moz-range-thumb {
        width: 8px;
        height: 16px;
        border: none;
        border-radius: var(--tp-blade-border-radius, 2px);
        background: var(--tp-button-background-color, #bbbcc4);
      }
      #pane .co-log-slider:hover::-webkit-slider-thumb {
        background: var(--tp-button-background-color-hover, #d6d7e0);
      }
      #pane .co-log-slider:active::-webkit-slider-thumb {
        background: var(--tp-button-background-color-active, #e4e5ea);
      }

      /* ---- guided tour (src/ui/tour.ts) --------------------------------

         Opened by the pane's own first button, not by a chip out here — see
         that button's own note in controls.ts on why it sits with the
         controls it is about. Everything below is the overlay it opens.

         z-index 5 is one above #hint's 4, the top of the ladder this page
         had before the tour existed — the overlay has to sit over every
         piece of chrome, including the hint that fires on the way into a
         hidden UI. `display` and the fade are separate concerns, sequenced
         across the transition exactly as #ack-panel's are (see
         acknowledgements.ts): `.tour-open` paints, the next frame's
         `.tour-lit` fades in, and closing waits for `transitionend` before
         reaching back for `display: none`. */
      #tour {
        position: fixed; inset: 0; z-index: 5;
        display: none;
        pointer-events: none;
        opacity: 0;
        transition: opacity .18s ease;
      }
      #tour.tour-open { display: block; }
      #tour.tour-lit { opacity: 1; }

      /* Four of these tile the gap between the lit control and its own
         container — not the window — rather than one element with a hole cut
         in it. Two reasons, both in tour.ts's header: #pane declares no
         z-index, so raising one blade above a covering overlay would raise
         the whole panel with it; and confining them to the container is what
         keeps them off the canvas, which the tour never dims. They take
         pointer events, which is what leaves the one control a step is about
         as the only thing reachable inside its panel. The dim is the page's
         own background colour at opacity, so what shows through reads as the
         panel going quiet rather than as a grey sheet over it. */
      .tour-shade {
        position: absolute;
        background: rgba(5, 5, 12, .68);
        pointer-events: auto;
        /* Twice the .12s the panels and popovers above use: a spotlight
           crossing the screen between steps is a larger and more deliberate
           move than a drop-down opening in place, and at .12s it reads as a
           jump rather than as the same hole travelling. */
        transition: top .24s ease, left .24s ease, width .24s ease, height .24s ease;
      }
      /* Drawn inside its own box (border-box), so with tour.ts's 6px of
         padding around the target the outline lands in that padding rather
         than over the control it is pointing at. */
      .tour-ring {
        position: absolute; box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, .35);
        border-radius: 6px;
        pointer-events: none;
        transition: top .24s ease, left .24s ease, width .24s ease,
                    height .24s ease, opacity .18s ease;
      }

      /* What the tour actually dims. Never the canvas: a reader is meant to be
         watching the simulation while a control is explained, so the field
         stays at full brightness for every step, and it is the interface
         around it that goes down. The same four containers `.chrome-hidden`
         names, spelled out for the same reason (see that rule above).

         The one holding the control a step is lighting is exempt — it stays
         at full brightness and gets the spotlight above instead, which dims
         everything in it *except* that control. Exempting it is not
         optional: `opacity` applies to a whole subtree, so a blade inside a
         container at .3 cannot be painted back up to 1 by any rule of its
         own, and the lit control would come out as dim as its neighbours.

         The transition is declared unconditionally, so it runs on the way
         back up as well as on the way down. `#hud`'s children take the
         pointer rule rather than #hud itself, since each of them opts back
         into the pointer events #hud turns off. */
      #hud, #traces, #scale, #pane { transition: opacity .24s ease; }
      /* `:not(.tour-lit-host)` on each of the four, rather than a separate
         rule painting the lit one back to 1: these selectors carry an id, so
         a `.tour-lit-host` rule alongside them loses the cascade outright and
         the lit panel dims with the rest. Excluding it here means there is
         nothing to out-specify — the rule simply does not match it. */
      html.tour-dim-chrome #hud:not(.tour-lit-host),
      html.tour-dim-chrome #traces:not(.tour-lit-host),
      html.tour-dim-chrome #scale:not(.tour-lit-host),
      html.tour-dim-chrome #pane:not(.tour-lit-host) {
        opacity: .3;
      }
      html.tour-dim-chrome #hud:not(.tour-lit-host) > *,
      html.tour-dim-chrome #traces:not(.tour-lit-host),
      html.tour-dim-chrome #scale:not(.tour-lit-host),
      html.tour-dim-chrome #pane:not(.tour-lit-host) {
        pointer-events: none;
      }

      /* Same opaque surface as #ack-panel, for the same reason: legible
         prose matters more here than blending into the canvas the way a
         corner chip does. Deliberately not scaled by --ui-scale — the three
         containers that variable resizes are the app's own chrome, and this
         is the tour's, sized for reading. */
      .tour-card {
        position: absolute; box-sizing: border-box;
        width: clamp(240px, 32vw, 340px);
        padding: 12px 14px;
        background: rgba(7, 7, 14, .92);
        border: 1px solid rgba(255, 255, 255, .1);
        border-radius: 6px;
        color: #cfe;
        font: 12px/1.5 ui-monospace, monospace;
        pointer-events: auto;
        transition: left .24s ease, top .24s ease;
      }
      .tour-count {
        color: rgba(207, 238, 255, .7);
        font-size: 11px; letter-spacing: .04em;
      }
      .tour-title { margin: 2px 0 8px; font: inherit; font-weight: 700; color: #fff; }
      .tour-body p { margin: 0 0 8px; }
      .tour-body p:last-child { margin-bottom: 0; }
      /* What to look for, set apart from why the control exists — a left rule
         in the first colour of the same validated categorical palette the
         corner trace legends and the acknowledgements dots draw from
         (nusselt.ts, rms.ts, acknowledgements.ts), reused rather than picked
         fresh so a panel with no scientific content still reads as part of
         the same system as the ones that do. */
      .tour-watch {
        margin-top: 10px; padding: 2px 0 2px 9px;
        border-left: 2px solid #d95926;
        color: rgba(207, 238, 255, .85);
      }
      /* How much of the effect the step is waiting on has developed. It
         gates nothing — see tour.ts on why a dwell nudges rather than
         advances — so it is a hairline, the same weight as the panel
         borders, not a progress dialog. */
      .tour-bar {
        margin-top: 10px; height: 2px; border-radius: 1px;
        background: rgba(255, 255, 255, .1);
        overflow: hidden;
      }
      .tour-bar-fill { width: 0; height: 100%; background: #d95926; }
      /* Undoing the tour is not a way through it — see tour.ts on why this
         is its own row rather than a fourth button in the one below. */
      .tour-restore { margin-top: 12px; }
      .tour-restore .tour-btn { width: 100%; }
      .tour-nav {
        display: flex; align-items: center; gap: 6px;
        margin-top: 12px;
      }
      .tour-spacer { flex: 1; }
      .tour-btn {
        appearance: none; border: none;
        padding: 5px 10px; border-radius: 6px;
        background: rgba(255, 255, 255, .08); color: #cfe;
        font: inherit; cursor: pointer;
      }
      .tour-btn:hover { background: rgba(255, 255, 255, .14); color: #fff; }
      .tour-btn:disabled { opacity: .35; cursor: default; }
      .tour-btn:disabled:hover { background: rgba(255, 255, 255, .08); color: #cfe; }
      /* Leaving and restoring are both ways out, and neither should compete
         with the button that carries the tour forward. */
      .tour-btn-quiet {
        padding-left: 0; background: none;
        color: rgba(207, 238, 255, .7);
      }
      .tour-btn-quiet:hover { background: none; color: #fff; }
      /* The nudge: once a step's dwell bar has filled, "next" stops being
         merely the button that happens to be there. Also set outright on the
         last step, which has nothing left to wait for. */
      .tour-btn-ready { background: #d95926; color: #fff; }
      .tour-btn-ready:hover { background: #ef6a33; color: #fff; }

      /* The app has no motion preference to honour anywhere else — nothing
         else in it moves except at a reader's own direct request. The tour
         does: a slider seen to travel and a camera seen to fly are how it
         makes its point. So the preference is honoured here and only here,
         and only for the motion — every step still runs, and tour.ts turns
         the ramp and the camera flight into instant arrivals to match. */
      @media (prefers-reduced-motion: reduce) {
        #tour, .tour-shade, .tour-ring, .tour-card { transition: none; }
      }

      @media (max-width: 600px) {
        #log, #caption { font-size: 10px; padding: 6px 8px; }
        #traces figure { font-size: 10px; padding: 5px 8px 4px; }
        /* Bottom-centred and near-full-width at this size — tour.ts stops
           trying to place the card beside the hole below the same 600px. */
        .tour-card { width: calc(100vw - 24px); }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <div id="caption"></div>
      <pre id="log"></pre>
      <a id="report-bug" href="https://github.com/nate-sime/nate-sime.github.io/issues" target="_blank" rel="noopener">Report a bug or request a feature</a>
      <div id="ack">
        <button id="ack-toggle" type="button">Acknowledgements</button>
        <div id="ack-panel"></div>
      </div>
    </div>
    <div id="traces">
      <figure id="rms"></figure>
      <figure id="nu"></figure>
    </div>
    <div id="scale"></div>
    <div id="pane"></div>
    <div id="msg"></div>
    <div id="hint"></div>
    <div id="tour"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
