<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mantle convection</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05050c; overflow: hidden; }
      body { display: grid; place-items: center; }
      #view { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
      /* Set from the "UI scale" slider (src/ui/controls.ts) and read by the
         three chrome overlays below — the pane, HUD and corner plots — never
         by #view: the simulation canvas already has its own scroll-to-zoom,
         and scaling it too would fight that rather than complement it. */
      :root { --ui-scale: 1; }
      /* Top-left HUD: an always-on caption (app name/version, and what
         colour means — set from main.ts, since the version string is only
         known at build time) stacked above the debug readout (`#log`, off
         by default — see main.ts). One flex column rather than each
         claiming the same fixed corner, so turning debug on draws `#log`
         below the caption instead of over it. */
      #hud {
        position: fixed; top: 8px; left: 8px; z-index: 2;
        display: flex; flex-direction: column; gap: 6px;
        max-width: min(70vw, 420px);
        pointer-events: none;
        /* Anchored at the corner it's pinned to, so scaling grows/shrinks it
           away from that corner rather than drifting off it. */
        transform: scale(var(--ui-scale));
        transform-origin: top left;
      }
      #caption {
        padding: 6px 10px;
        color: #cfe; background: rgba(0,0,0,.45); border-radius: 6px;
        font: 12px/1.4 ui-monospace, monospace; white-space: pre-line;
      }
      #log {
        display: none;
        margin: 0; padding: 10px 12px;
        color: #cfe; background: rgba(0,0,0,.45); border-radius: 6px;
        font: 12px/1.45 ui-monospace, monospace; white-space: pre;
      }
      #msg {
        position: fixed; inset: 0; display: none; place-items: center;
        padding: 2rem; text-align: center; color: #cdd;
        font: 15px/1.6 system-ui, sans-serif;
      }
      #msg[data-show] { display: grid; }

      /* The control pane gets an explicit container rather than Tweakpane's
         default fixed 256px, because this page is embedded in an iframe whose
         width the page decides — at ~350px the default would sit on top of the
         readout. Scrolls rather than overflowing a short frame. */
      #pane {
        position: fixed; top: 8px; right: 8px;
        width: clamp(168px, 42%, 256px);
        max-height: calc(100% - 16px); overflow-y: auto;
        /* Same corner-anchored scale as #hud, on the pane's own opposite
           corner — see "UI scale" in src/ui/controls.ts. */
        transform: scale(var(--ui-scale));
        transform-origin: top right;
      }

      /* The viscosity equation and its legend (see src/ui/equation.ts). Drawn
         as plain elements inside the pane, so it borrows Tweakpane's own colour
         variables rather than guessing at a theme, and its margins are the
         pane's container padding — otherwise it would sit flush against the
         list above it while every real blade is inset. */
      #pane .eq {
        margin: 2px var(--tp-container-horizontal-padding, 4px) 4px;
        padding: 6px 8px;
        border-radius: var(--tp-blade-border-radius, 2px);
        background-color: var(--tp-container-background-color, rgba(187, 188, 196, .1));
        color: var(--tp-container-foreground-color, #bbbcc4);
        font-size: 10px; line-height: 1.5;
      }
      #pane .eq p { margin: 0; }
      /* The formula itself: monospace so the spacing around the operators
         survives, and free to wrap, since the pane can be 168px wide. */
      #pane .eq .eq-f {
        font-family: ui-monospace, monospace; font-size: 11px;
        overflow-wrap: break-word;
      }
      #pane .eq .eq-f + .eq-f { margin-top: 2px; }
      #pane .eq sup { font-size: .75em; }
      /* symbol = value ......... the slider that sets it. The pane can be 168px
         wide, where the two do not fit on one line: the control name wraps below
         the symbol rather than the pair being squeezed into a column each. */
      #pane .eq .eq-p { display: flex; flex-wrap: wrap; gap: 0 8px; margin-top: 4px; }
      #pane .eq .eq-p b {
        font-family: ui-monospace, monospace; font-weight: 400;
        white-space: nowrap;
      }
      /* Hard right, whether it shares the symbol's line or wraps below it. */
      #pane .eq .eq-p span {
        margin-left: auto;
        color: var(--tp-label-foreground-color, rgba(187, 188, 196, .7));
      }
      #pane .eq .eq-n {
        margin-top: 5px; text-wrap: pretty;
        color: var(--tp-label-foreground-color, rgba(187, 188, 196, .7));
      }

      /* Colour-bar legend (src/ui/colorbar.ts): a CSS gradient reproducing the
         shader's own control points, so it sits in the pane like `.eq` above —
         same container padding, no Tweakpane blade of its own. */
      #pane .cbar {
        margin: 2px var(--tp-container-horizontal-padding, 4px) 4px;
      }
      #pane .cbar-bar {
        height: 10px;
        border-radius: var(--tp-blade-border-radius, 2px);
        border: 1px solid rgba(255, 255, 255, .15);
      }
      #pane .cbar-ticks {
        display: flex; justify-content: space-between;
        margin-top: 2px;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        color: var(--tp-label-foreground-color, rgba(187, 188, 196, .7));
      }

      /* The two corner traces (src/ui/nuplot.ts, src/ui/rmsplot.ts), stacked
         into the one corner the pane leaves clear. Not one in each bottom
         corner: `#pane`'s `max-height: calc(100% - 16px)` means it fills
         essentially the whole right edge on any viewport tall enough to
         scroll it, which every viewport with this many controls is — so
         bottom-right is the pane's own territory, not a second free corner.
         Stacking instead of placing side by side is what survives a narrow
         embed too: two 150px-floor panels do not fit side by side under
         `#pane`'s own ~168px floor, but they always fit stacked.

         `#traces` is the fixed anchor and owns none of the chrome; `nu` sits
         last so it stays flush with the viewport's bottom edge exactly where
         it always was, and `rms` sits above it with a gap standing in for the
         seam a screen edge would otherwise draw for free. */
      #traces {
        position: fixed; left: 0; bottom: 0;
        display: flex; flex-direction: column; gap: 8px;
        /* Same corner-anchored scale as #hud/#pane, on this corner's own
           bottom-left pin — see "UI scale" in src/ui/controls.ts. */
        transform: scale(var(--ui-scale));
        transform-origin: bottom left;
      }

      /* Nearly opaque, unlike the readout's .45: these carry colour-coded
         marks rather than text, and every series was validated for ≥ 3:1
         contrast against the surface 8% of the field showing through can
         produce (see `nusselt.ts`, `rms.ts`). */
      #traces figure {
        margin: 0;
        width: clamp(150px, 40vw, 300px);
        padding: 7px 10px 6px;
        box-sizing: border-box;
        background: rgba(7, 7, 14, .92);
        border-top: 1px solid rgba(255, 255, 255, .1);
        border-right: 1px solid rgba(255, 255, 255, .1);
        border-top-right-radius: 6px;
        color: #cfe;
        font: 11px/1.4 ui-monospace, monospace;
        pointer-events: none;
      }
      /* Sized to include the tick band the canvas draws inside it, so the axis
         labels are never what gets cropped. That band is two rows — the same two
         instants nondimensionally and in years — which is 28px of the height
         below, not 14. */
      #traces canvas {
        display: block; width: 100%;
        height: clamp(72px, 14vh, 106px);
      }
      #traces figcaption {
        margin-bottom: 4px;
        color: rgba(207, 238, 255, .7);
      }
      /* One row per series — the legend is the identity channel, and it
         doubles as the live readout, which is why the values sit in it rather
         than as labels on the curve ends: at steady state Nu's two ends
         coincide, and labels there would collide exactly when the plot
         matters most. */
      #traces .nu-key, #traces .rms-key { margin: 4px 0 0; padding: 0; list-style: none; }
      #traces .nu-key li, #traces .rms-key li { display: flex; align-items: center; gap: 6px; }
      /* `height` is set per series from the width that series is stroked at
         (see nuplot.ts, rmsplot.ts) — the key samples the mark rather than
         standing in for it. */
      #traces .nu-key i, #traces .rms-key i {
        width: 10px; height: 2px; border-radius: 2px; flex: none;
      }
      #traces .nu-key b, #traces .rms-key b {
        margin-left: auto; font-weight: 400;
        font-variant-numeric: tabular-nums;
      }

      /* Stand-in for Tweakpane's own slider, shared by the Courant number and
         dt cap bindings (src/ui/controls.ts): dragged in log₁₀ space so each
         decade gets an equal share of the travel, while the adjacent number
         field keeps showing/accepting the real value. Sized and coloured off
         Tweakpane's own variables so it reads as one of its sliders rather
         than a foreign control dropped into the pane. */
      #pane .co-log-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: var(--tp-container-unit-size, 20px);
        margin: 0;
        background: transparent;
      }
      #pane .co-log-slider::-webkit-slider-runnable-track {
        height: 2px;
        border-radius: 1px;
        background: var(--tp-input-background-color, rgba(187, 188, 196, .2));
      }
      #pane .co-log-slider::-moz-range-track {
        height: 2px;
        border-radius: 1px;
        background: var(--tp-input-background-color, rgba(187, 188, 196, .2));
      }
      #pane .co-log-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 8px;
        height: 16px;
        margin-top: -7px;
        border: none;
        border-radius: var(--tp-blade-border-radius, 2px);
        background: var(--tp-button-background-color, #bbbcc4);
      }
      #pane .co-log-slider::-moz-range-thumb {
        width: 8px;
        height: 16px;
        border: none;
        border-radius: var(--tp-blade-border-radius, 2px);
        background: var(--tp-button-background-color, #bbbcc4);
      }
      #pane .co-log-slider:hover::-webkit-slider-thumb {
        background: var(--tp-button-background-color-hover, #d6d7e0);
      }
      #pane .co-log-slider:active::-webkit-slider-thumb {
        background: var(--tp-button-background-color-active, #e4e5ea);
      }

      @media (max-width: 600px) {
        #log, #caption { font-size: 10px; padding: 6px 8px; }
        #traces figure { font-size: 10px; padding: 5px 8px 4px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <div id="caption"></div>
      <pre id="log"></pre>
    </div>
    <div id="traces">
      <figure id="rms"></figure>
      <figure id="nu"></figure>
    </div>
    <div id="pane"></div>
    <div id="msg"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
