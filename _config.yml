theme: jekyll-theme-minimal
title: Nate Sime
description: Personal webpage
url: https://nate-sime.github.io/

titles_from_headings:
  enabled:     true
  strip_title: true
  collections: true

# The web apps are developed in apps/<name>/ (each with its own tooling) and
# build into assets/<name>/. Keep the source workshops out of the site.
exclude:
  - apps/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - vendor/
